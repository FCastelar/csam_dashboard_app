name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; queued runs replace each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        # No workbook exists in CI: the bundle must ship code only.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Fail if customer data leaked into the bundle
        # The dashboard ships code only, so any spreadsheet or data file is a leak.
        run: |
          leaked=$(find dist \( -name '*.xlsx' -o -name '*.xls' -o -name '*.csv' -o -name '*.json' \))
          if [ -n "$leaked" ]; then
            echo 'Customer data found in dist/. Aborting deployment.'
            echo "$leaked"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
